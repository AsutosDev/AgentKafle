name: Build Windows Installer

on:
  workflow_dispatch:        # manual trigger
  push:
    tags:
      - 'v*'               # triggered by version tags e.g. v1.0.0

permissions:
  contents: write          # needed to upload release assets

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        run: pyinstaller --clean agentkafle_windows.spec

      - name: Rename executable to versioned filename
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrEmpty($tag)) { $tag = '1.0.0' }
          Rename-Item -Path "dist\AgentKafle.exe" -NewName "AgentKafle-v${tag}-Windows.exe"

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/AgentKafle-v*-Windows.exe
          retention-days: 30

      - name: Attach to GitHub Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload "$tag" dist/AgentKafle-v*-Windows.exe --clobber
